[project]
name = "qq-rss-bot"
version = "0.1.0"
description = "QQ 群 RSS 订阅机器人（基于 qq-botpy + RSSHub）"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "qq-botpy>=1.2.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "trafilatura>=2.3.1",
]

[project.scripts]
qq-rss-bot = "qq_rss_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qq_rss_bot"]
