# 群晖 DS220+ 部署用（Container Manager → 项目）。
#
# 两个必须记住的差异（都是实机实测结论，见 docs/synology-migration.md）：
#
#   * bot 的 RSSHUB_BASE 要用**服务名 rsshub**，不是 127.0.0.1
#     —— 容器里的 loopback 是容器自己。忘了改的症状是抓取全部超时。
#   * **代理只给 rsshub，绝不能给 bot**。bot 要访问 http://rsshub:1200
#     这个 Docker 内部服务名，走代理必然解析不了；而且 bot 的命脉
#     api.sgroup.qq.com 是国内站，直连更快更稳，套代理等于凭空多一个
#     「代理挂了我就掉线」的依赖。
#
# 代码本身不用改：RSSHUB_BASE 一直是环境变量。

services:
  rsshub:
    image: diygod/rsshub
    restart: unless-stopped
    ports:
      - "1200:1200"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      # 全部上游走代理：v2ex / github 这些容器内直连不通（v2ex 实测 DNS 被
      # 污染到 Facebook 的 IP 段），国内源经代理实测无延迟代价（Surge 在做规则分流）。
      # ⚠️ 这个地址是 Apple TV 上的 Surge，**给它做 DHCP 固定**，否则路由器重启后
      #    地址一变，所有 RSS 抓取会停。
      - HTTP_PROXY=http://192.168.0.63:6152
      - HTTPS_PROXY=http://192.168.0.63:6152
      - NO_PROXY=localhost,127.0.0.1
    # RSSHub 的内存**不回落**（Node 堆保留 + 路由缓存，压测后 30 秒仍是 646MB）。
    # 6GB 的机器上无顾虑；真一路涨到 2GB 以上说明有路由泄漏，届时开这个当安全网
    # （OOM 被杀后自动重启，只表现为一次推送延迟）。
    # mem_limit: 2g

  bot:
    build: .
    image: qq-rss-bot:latest
    restart: unless-stopped
    depends_on:
      - rsshub
    # 自建图床（见 src/qq_rss_bot/imgsrv.py）。markdown 的图是 **QQ 的服务器**
    # 去抓的，而它够不到 pbs.twimg.com —— 贺图得由我们自己发一份。
    # ⚠️ 只发布这一个端口；路由器那边 WAN:18080 → 本机:18080。
    #    别用 80/443（电信封入站）。改这一行要 `up -d`，`restart` 不生效。
    ports:
      - "18080:18080"
    env_file:
      - .env
    environment:
      # 内部服务名，绝不能走代理
      - RSSHUB_BASE=http://rsshub:1200
      # 绝对路径：不依赖 config.PROJECT_ROOT 的推算，换安装方式也不会写错地方
      - DB_PATH=/app/data/bot.db
      # 日志同时写进挂载卷 —— docker logs 要 root，写这儿非 root 也能读
      - LOG_FILE=/app/data/bot.log
      - TZ=Asia/Shanghai
      # 显式清空。dockerd.json 里配了 proxies，但实测运行中的守护进程没应用它；
      # 万一哪天生效了，上面两条内部调用会被打断。
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - NO_PROXY=localhost,127.0.0.1,rsshub,api.sgroup.qq.com,bots.qq.com
    volumes:
      # SQLite 和 RSSHub 路由缓存都落在这里，必须持久化
      - ./data:/app/data
      # **热更新**：`uv sync` 装的是可编辑版（.pth 指向 /app/src），容器是
      # **运行时**去这个目录 import 的 —— 把宿主的 src 挂进去，改完代码只要
      # `docker compose restart bot`（约 2 秒），不用重建镜像。
      # `:ro` = 容器不许写；Python 因此写不了 __pycache__，从源码跑，无所谓。
      #
      # 代价：**镜像不再等于「正在跑什么」**。所以启动日志里多了一条
      # `运行代码 /app/src/qq_rss_bot（最新改动 <时间>）`（见 __main__.code_identity）：
      # 那个时间是**你刚保存的时间**才说明生效了；是镜像构建时间就说明没生效。
      # —— 那条日志是挂载的前提，别删。
      - ./src:/app/src:ro
      # scripts/ 同理 —— 不加这条，新写的探测脚本在容器里根本不存在
      # （`docker compose exec bot python scripts/xxx.py` 会报 No such file）。
      # `docker cp` 可以临时塞进去，但重建容器就没了。
      - ./scripts:/app/scripts:ro
